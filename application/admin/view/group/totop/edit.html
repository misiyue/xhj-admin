<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <input type="hidden" name="row[id]" value="{$row.id|htmlentities}">
    <div class="form-group">
        <label for="c-cover" class="control-label col-xs-12 col-sm-2">{:__('Cover')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-cover" class="form-control" size="50" name="row[cover]" type="text" value="{$row.cover|default=''|htmlentities}" placeholder="https://">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="faupload-cover" class="btn btn-danger faupload" data-url="group/totop/uploadOssImage" data-input-id="c-cover" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp,image/webp" data-multiple="false" data-preview-id="p-cover"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-cover" class="btn btn-primary fachoose" data-input-id="c-cover" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-cover"></span>
            </div>
            <ul class="row list-inline faupload-preview" id="p-cover"></ul>
        </div>
    </div>
    <div class="form-group">
        <label for="c-intro" class="control-label col-xs-12 col-sm-2">{:__('Intro')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-intro" class="form-control" name="row[intro]" type="text" value="{$row.intro|default=''|htmlentities}" maxlength="255" data-rule="length(0~255)">
        </div>
    </div>
    <div class="form-group">
        <label for="c-btn" class="control-label col-xs-12 col-sm-2">{:__('Btn')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-btn" class="form-control" name="row[btn]" type="text" value="{$row.btn|default=''|htmlentities}" maxlength="255" data-rule="length(0~255)">
        </div>
    </div>
    <div class="form-group">
        <label for="c-url" class="control-label col-xs-12 col-sm-2">{:__('Url')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-url" class="form-control" name="row[url]" type="text" value="{$row.url|default=''|htmlentities}" maxlength="255" placeholder="https://" data-rule="length(0~255)">
        </div>
    </div>
    <div class="form-group">
        <label for="c-group_ids" class="control-label col-xs-12 col-sm-2">{:__('Group_ids')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-group_ids" class="form-control" name="row[group_ids]" type="text" value="{$row.group_ids|default=''|htmlentities}" maxlength="255" placeholder="1,2,3">
            <span class="help-block">{:__('Group_ids help')}</span>
        </div>
    </div>
    <div class="form-group">
        <label for="c-sort" class="control-label col-xs-12 col-sm-2">{:__('Sort')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-sort" class="form-control" name="row[sort]" type="number" value="{$row.sort|default='0'|htmlentities}" min="0" data-rule="integer">
            <span class="help-block">{:__('Sort tips')}</span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
