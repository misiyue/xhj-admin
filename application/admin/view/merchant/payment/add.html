<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label for="c-title" class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" class="form-control" name="row[title]" type="text" value="" maxlength="16" data-rule="length(0~16)">
        </div>
    </div>
    <div class="form-group">
        <label for="c-code" class="control-label col-xs-12 col-sm-2">{:__('Code')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-code" class="form-control" name="row[code]" type="text" value="" maxlength="8" data-rule="required;length(1~8)">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Platform')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[platform]', $platformList, 'hd')}
        </div>
    </div>
    <div class="form-group">
        <label for="c-min" class="control-label col-xs-12 col-sm-2">{:__('Min limit')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-min" class="form-control" name="row[min]" type="number" value="" min="0" data-rule="integer(+0)">
        </div>
    </div>
    <div class="form-group">
        <label for="c-max" class="control-label col-xs-12 col-sm-2">{:__('Max limit')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-max" class="form-control" name="row[max]" type="number" value="" min="0" data-rule="integer(+0)">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
