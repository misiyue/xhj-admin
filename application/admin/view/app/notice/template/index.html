<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        {:build_toolbar('refresh')}
                        {if $auth->check('app/notice/letter/index')}
                        <a href="app/notice/letter/index" class="btn btn-info btn-dialog" title="{:__('Notice letter')}" data-area='["90%","85%"]'><i class="fa fa-send"></i> {:__('Notice letter')}</a>
                        {/if}
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('app/notice/template/edit')}"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
