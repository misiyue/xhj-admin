<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    {:token()}
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Platform')}:</label>
        <div class="col-xs-12 col-sm-4">
            {:build_select('row[platform]', $platformList, 'android', ['class'=>'form-control selectpicker', 'id'=>'c-platform', 'data-rule'=>'required'])}
        </div>
    </div>
    <div class="form-group">
        <label for="c-channel" class="control-label col-xs-12 col-sm-2">{:__('Channel')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-channel" data-rule="required" class="form-control" name="row[channel]" type="text" value="" placeholder="enterprise / appstore">
        </div>
    </div>
    <div class="form-group">
        <label for="c-latest_version_name" class="control-label col-xs-12 col-sm-2">{:__('Latest_version_name')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-latest_version_name" data-rule="required" class="form-control" name="row[latest_version_name]" type="text" value="" placeholder="1.0.0">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Upgrade_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            {:build_radios('row[upgrade_type]', $upgradeTypeList, 'optional')}
        </div>
    </div>
    <div class="form-group">
        <label for="c-title" class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" class="form-control" name="row[title]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label for="c-release_notes" class="control-label col-xs-12 col-sm-2">{:__('Release_notes')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-release_notes" class="form-control" rows="6" name="row[release_notes]" placeholder='["说明1","说明2"]'></textarea>
            <span class="help-block">{:__('Json array tips')}</span>
        </div>
    </div>
    <div class="form-group">
        <label for="c-download_urls" class="control-label col-xs-12 col-sm-2">{:__('Download_urls')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-download_urls" class="form-control" rows="6" name="row[download_urls]" placeholder='["https://cdn.example.com/app-release.apk"]'></textarea>
            <span class="help-block">{:__('Download urls string tips')}</span>
        </div>
    </div>
    <div class="form-group">
        <label for="c-published_at" class="control-label col-xs-12 col-sm-2">{:__('Published_at')}:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-published_at" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[published_at]" type="text" value="">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
