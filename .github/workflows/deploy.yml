name: 自动部署

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage  # ⚠️ 添加这一行，指定环境名称
    steps:
      - name: 在服务器上拉取代码
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /www/wwwroot/xhj-admin
            sudo -u www git reset --hard HEAD~1
            sudo -u www git pull